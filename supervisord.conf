[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Only the gateway is supervised here — see entrypoint.sh for why.
[program:gateway]
command=hermes gateway run
directory=/app
autostart=true
autorestart=true
startretries=100
; Real files now, not /dev/stdout directly -- Sandy's own process can
; tail these (diagnostics.py) so a Hermes-side failure (e.g. the 401
; auth traceback that used to be invisible to her) is something she can
; actually read, not just Ruk pasting logs back to Claude. entrypoint.sh
; tails both back out to the container's stdout so HF's live log viewer
; keeps showing everything exactly as before -- nothing lost, one more
; real reader added.
stdout_logfile=/tmp/hermes_gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
stderr_logfile=/tmp/hermes_gateway.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=1
